[project]
name = "atuout"
version = "0.1.0"
description = "Shell command-output harvester — archives Atuin's native command captures, linked to Atuin history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

dependencies = [
  "pydantic>=2.12.5",
  "grpcio>=1.60",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "mypy>=1.10",
  "ruff>=0.5.0",
  "grpcio-tools>=1.60",
  "pexpect>=4.9",
]

[project.scripts]
atuout = "atuout.cli:main"

#[project.urls]
#homepage = "https://github.com/Bullish-Design/atuout"
#repository = "https://github.com/Bullish-Design/atuout.git"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atuout"]

[tool.hatch.build.targets.wheel.force-include]
"shell/atuout.zsh" = "atuout/shell/atuout.zsh"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "tests",
  "pyproject.toml",
]

[tool.uv]

[tool.pytest.ini_options]
addopts = "-q --cov=atuout --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "slow: spawns real processes / waits on timers (opt-in integration tests)",
]

[tool.coverage.run]
omit = ["src/atuout/_proto/*"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["atuout"]
exclude = ["src/atuout/_proto/"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["atuout._proto.*"]
ignore_errors = true
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["grpc"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
extend-exclude = ["src/atuout/_proto"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
