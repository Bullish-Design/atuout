[project]
name = "atuout"
version = "0.1.0"
description = "Shell command-output harvester — archives Atuin's native command captures, linked to Atuin history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Bullish Design", email = "BullishDesignEngineering@gmail.com" },
]

dependencies = [
  "pydantic>=2.12.5",
  "grpcio>=1.60",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.1",
  "ty>=0.0.56",
  "ruff>=0.5.0",
  "grpcio-tools>=1.60",
  "pexpect>=4.9",
]

[project.scripts]
atuout = "atuout.cli:main"

#[project.urls]
#homepage = "https://github.com/Bullish-Design/atuout"
#repository = "https://github.com/Bullish-Design/atuout.git"

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atuout"]

[tool.hatch.build.targets.wheel.force-include]
"shell/atuout.zsh" = "atuout/shell/atuout.zsh"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "tests",
  "pyproject.toml",
]

[tool.uv]

[tool.pytest.ini_options]
addopts = "-q --cov=atuout --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "slow: spawns real processes / waits on timers (opt-in integration tests)",
]

[tool.coverage.run]
omit = ["src/atuout/_proto/*"]

[tool.ty.environment]
python-version = "3.13"
# src-layout: only atuout is first-party; matches the old mypy `mypy_path`/`packages`.
root = ["./src"]

[tool.ty.analysis]
# grpcio ships no type info; mirrors mypy's `ignore_missing_imports` override for grpc.
# Generated _proto modules define members at runtime via `__getattr__`; treat them as Any,
# like mypy's `follow_imports = "skip"` + `ignore_errors` override.
replace-imports-with-any = ["grpc.**", "atuout._proto.**"]

[tool.ty.src]
# Check only the package (mypy used `packages = ["atuout"]`); leave tests to ruff/pytest.
include = ["src"]
# Protobuf-generated code: checked at build time by the gencode test instead.
exclude = ["src/atuout/_proto/"]

[tool.ty.rules]
# Approximate mypy --strict for the checks ty leaves disabled by default.
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
extend-exclude = ["src/atuout/_proto"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
